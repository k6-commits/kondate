# ホーム画面に置く版（PWA）を GitHub Pages に公開する：https://k6-commits.github.io/kondate/
# prototype/ で npm ci → 型の検査 → テスト → npm run build:pwa（dist-pwa/ を作って検査する）→ Pages に載せる。
#
# はじめに1回だけ、リポジトリの Settings → Pages → Build and deployment の Source を「GitHub Actions」にする
# （しないうちは「Configure Pages」で止まる）。そのあとは、下のブランチに prototype/ の変更を push するたびに公開し直す。
# 手で公開し直すときは、Actions の「Deploy the PWA to GitHub Pages」から Run workflow。
name: Deploy the PWA to GitHub Pages

on:
  push:
    branches:
      - claude/wizardly-cerf-5uox41
    paths:
      - 'prototype/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開は1つずつ。途中の公開は止めない（新しい push の分は、そのあとに続く）。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: prototype
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          # いちばん新しい 22.x を使う（ランナーに入っている古い 22.x のままにしない。jsdom 31 は 22.22.2 以上が要る）。
          check-latest: true
          cache: npm
          cache-dependency-path: prototype/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build the PWA (and check it)
        run: npm run build:pwa

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: prototype/dist-pwa

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
